<!DOCTYPE html>
<html class="no-js" lang="pt-BR">

<head>
    <base href="/" />
    <title>Autores - Libri</title>
    {INCLUDE_CABECALHO}
</head>

<body>
    <!-- Layout wrapper -->
    <div class="layout-wrapper layout-content-navbar">
        <div class="layout-container">

            <!-- Menu -->
            {INCLUDE_TOPO}
            <!-- / Menu -->

            <!-- Layout container -->
            <div class="layout-page">

                <!-- Navbar -->
                <nav class="layout-navbar container-xxl navbar navbar-expand-xl navbar-detached align-items-center bg-navbar-theme"
                    id="layout-navbar">
                    <div class="layout-menu-toggle navbar-nav align-items-xl-center me-3 me-xl-0 d-xl-none">
                        <a class="nav-item nav-link px-0 me-xl-4" href="javascript:void(0)">
                            <i class="bx bx-menu bx-sm"></i>
                        </a>
                    </div>
                    <div class="navbar-nav-right d-flex align-items-center" id="navbar-collapse">
                        <ul class="navbar-nav flex-row align-items-center ms-auto">
                            <a class="nav-link dropdown-toggle hide-arrow" href="javascript:void(0);"
                                data-bs-toggle="dropdown">
                                <img src="{URL_IMG}/logo/logo.svg" alt class="w-px-75 h-auto" />
                            </a>
                        </ul>
                    </div>
                </nav>
                <!-- / Navbar -->

                <!-- Content wrapper -->
                <div class="content-wrapper">
                    <!-- Content -->

                    <div class="container-xxl flex-grow-1 container-p-y">

                        <div class="d-flex justify-content-between align-items-end flex-wrap gap-2 py-3 mb-4">
                            <div>
                                <h4 class="fw-bold mb-1"><span class="text-muted fw-light">Autores/</span> Ver todos
                                </h4>
                                <!-- BEGIN EXIBIR_TOTAL_AUTORES -->
                                <p class="text-muted fst-italic fs-6 mb-0">{TOTAL_AUTORES} autores cadastrados no acervo
                                </p>
                                <!-- END EXIBIR_TOTAL_AUTORES -->
                            </div>
                        </div>

                        <!-- Tabela de autors -->
                        <div class="card py-3">

                            <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 p-3">

                                <div class="input-group input-group-merge" style="max-width: 360px;">
                                    <span class="input-group-text" id="basic-addon-search31"><i
                                            class="bx bx-search"></i></span>
                                    <input type="text" id="busca-autores" class="form-control"
                                        placeholder="Buscar por nome…" aria-label="Buscar..."
                                        aria-describedby="basic-addon-search31" />
                                </div>

                                <button type="button" data-bs-toggle="modal" data-bs-target="#modalCenter"
                                    class="btn rounded-pill btn-primary d-inline-flex align-items-center">
                                    <i class="bx bx-plus me-1"></i>
                                    Novo Autor
                                </button>

                            </div>

                            <div class="table-responsive text-nowrap">
                                <table class="table table-borderless" id="tabela-autores">
                                    <thead>
                                        <tr>
                                            <th>Nome</th>
                                            <th class="text-end">Ações</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <!-- BEGIN BLOCO_AUTORES -->
                                        <tr>
                                            <td>
                                                <a href="{URL}/autores/editar/{AUTOR->ID}"
                                                    class="d-flex align-items-center gap-2 link-primary text-body">
                                                    <strong>{AUTOR->NOME}</strong>
                                                </a>
                                            </td>
                                            <td>
                                                <div class="text-end">
                                                    <a href="{URL}/autores/editar/{AUTOR->ID}"
                                                        class="btn btn-icon btn-label-primary rounded-pill"
                                                        title="Editar autor">
                                                        <i class="bx bx-edit-alt"></i>
                                                    </a>
                                                    <a id="excluir-{AUTOR->ID}"
                                                        data-url="{URL}/excluir/Autor/{AUTOR->ID}"
                                                        href="{URL}/excluir/Autor/{AUTOR->ID}"
                                                        class="btn btn-icon btn-label-danger rounded-pill btn-excluir-genero"
                                                        title="Excluir autor">
                                                        <i class="bx bx-trash"></i>
                                                    </a>
                                                </div>
                                            </td>
                                        </tr>
                                        <!-- END BLOCO_AUTORES -->
                                        <tr>
                                            <td colspan="3" class="text-center py-5">
                                                <i class="bx bx-category-alt bx-lg text-muted mb-2 d-block"></i>
                                                <span class="fw-semibold d-block">Nenhum autor cadastrado</span>
                                                <span class="text-muted">Comece criando o primeiro autor do
                                                    acervo.</span>
                                            </td>
                                        </tr>
                                        <!-- FINALLY BLOCO_AUTORES -->
                                    </tbody>
                                </table>
                            </div>
                        </div>
                        <!--/ Tabela de autors -->
                    </div>
                    <!-- / Content -->

                    <!-- Footer -->
                    {INCLUDE_RODAPE}
                    <!-- / Footer -->

                    <div class="content-backdrop fade"></div>
                </div>
                <!-- Content wrapper -->
            </div>
            <!-- / Layout page -->
        </div>

        <div class="modal fade" id="modalCenter" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered" role="document">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="modalCenterTitle">Adicione um novo autor</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <form id="inserir" action="{URL}/Autor/salvar" method="POST">

                            <div class="mb-3">
                                <label class="form-label" for="genero_pai">Autor Principal</label>
                                <div class="input-group input-group-merge">
                                    <select class="form-select required" id="genero_pai" name="genero_pai"
                                        aria-label="Escolha o autor principal" placeholder="Escolha o autor principal">
                                        <option value="" disabled selected>Escolha o autor principal</option>
                                        <!-- BEGIN BLOCO_AUTORES_MODAL -->
                                        <option value="{AUTOR->ID}">{AUTOR->NOME}</option>
                                        <!-- END BLOCO_AUTORES_MODAL -->
                                        <option value="" disabled selected>Nenhum autor encontrado</option>
                                        <!-- FINALLY BLOCO_AUTORES_MODAL -->
                                    </select>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label required" for="nome">Nome *</label>
                                <div class="input-group input-group-merge">
                                    <span id="nome2" class="input-group-text">
                                        <i class="bx bx-text"></i>
                                    </span>
                                    <input type="text" id="nome" class="form-control"
                                        placeholder="Digite o nome do autor" name="nome"
                                        aria-label="Digite o nome do autor" aria-describedby="nome2" required />
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label" for="basic-icon-default-message">Descrição *</label>
                                <div class="input-group input-group-merge">
                                    <span id="basic-icon-default-message2" class="input-group-text"><i
                                            class="bx bx-comment"></i></span>
                                    <textarea id="basic-icon-default-message" class="form-control"
                                        placeholder="Digite a descrição do autor" name="descricao"
                                        aria-label="Digite a descrição do autor"
                                        aria-describedby="basic-icon-default-message2" required></textarea>
                                </div>
                            </div>

                            <input type="hidden" name="csrf-token" value="{CSRF_TOKEN}" />

                            <div class="d-flex justify-content-center">
                                <button type="submit" class="btn btn-primary">Salvar</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        {INCLUDE_JAVASCRIPT}

        <script>
            document.getElementById('busca-autores')?.addEventListener('input', function (e) {
                const termo = e.target.value.toLowerCase();
                document.querySelectorAll('#tabela-autores tbody tr').forEach(function (tr) {
                    tr.style.display = tr.textContent.toLowerCase().includes(termo) ? '' : 'none';
                });
            });
        </script>

        <!-- Overlay -->
        <div class="layout-overlay layout-menu-toggle"></div>

    </div>
    <!-- / Layout wrapper -->


</body>

</html>
