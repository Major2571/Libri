<!DOCTYPE html>
<html class="no-js" lang="pt-BR">

<head>
    <base href="/" />
    <title>Gêneros Literários - Libri</title>
    {INCLUDE_CABECALHO}
</head>

<body>
    <!-- Layout wrapper -->
    <div class="layout-wrapper layout-content-navbar">
        <div class="layout-container">

            <!-- Menu -->
            {INCLUDE_TOPO}
            <!-- / Menu -->

            <!-- Layout container -->
            <div class="layout-page">

                <!-- Navbar -->
                <nav class="layout-navbar container-xxl navbar navbar-expand-xl navbar-detached align-items-center bg-navbar-theme"
                    id="layout-navbar">
                    <div class="layout-menu-toggle navbar-nav align-items-xl-center me-3 me-xl-0 d-xl-none">
                        <a class="nav-item nav-link px-0 me-xl-4" href="javascript:void(0)">
                            <i class="bx bx-menu bx-sm"></i>
                        </a>
                    </div>
                    <div class="navbar-nav-right d-flex align-items-center" id="navbar-collapse">
                        <ul class="navbar-nav flex-row align-items-center ms-auto">
                            <a class="nav-link dropdown-toggle hide-arrow" href="javascript:void(0);" data-bs-toggle="dropdown">
                                <img src="{URL_IMG}/logo/logo.svg" alt class="w-px-75 h-auto" />
                            </a>
                        </ul>
                    </div>
                </nav>
                <!-- / Navbar -->

                <!-- Content wrapper -->
                <div class="content-wrapper">
                    <!-- Content -->

                    <div class="container-xxl flex-grow-1 container-p-y">
                        <h4 class="fw-bold py-3 mb-4"><span class="text-muted fw-light">
                            <a href="{URL}/generos"> Gêneros </a>
                            /</span> Editar
                        </h4>

                        <div class="card mb-4">
                            <div class="card-header d-flex justify-content-between align-items-center">
                                <h5 class="mb-0">Edite o gênero</h5>
                            </div>
                            <div class="card-body">

                                <form id="editar" action="{URL}/editar/Genero/{GENERO->ID}" method="POST">

                                    <div class="mb-3">
                                        <label class="form-label" for="genero_pai">Genero Principal</label>
                                        <div class="input-group input-group-merge">
                                            <select class="form-select required" id="genero_pai" name="genero_pai" aria-label="Select genero pai">
                                                <option value="" disabled>Escolha o gênero principal</option>
                                                <!-- BEGIN BLOCO_GENEROS -->
                                                <option value="{GENERO_SELECT->ID}" {genero_selecionado}>{GENERO_SELECT->NOME}</option>
                                                <!-- END BLOCO_GENEROS -->
                                            </select>
                                        </div>
                                    </div>

                                    <div class="mb-3">
                                        <label class="form-label" for="nome">Nome</label>
                                        <div class="input-group input-group-merge">
                                            <span id="nome2" class="input-group-text">
                                                <i class="bx bx-text"></i>
                                            </span>
                                            <input type="text" id="nome" class="form-control"
                                                placeholder="Digite o nome do gênero"
                                                name="nome" value="{GENERO->NOME}"
                                                aria-label="Digite o nome do gênero" aria-describedby="nome2" required />
                                        </div>
                                    </div>

                                    <div class="mb-3">
                                        <label class="form-label" for="basic-icon-default-message">Descrição</label>
                                        <div class="input-group input-group-merge">
                                            <span id="basic-icon-default-message2" class="input-group-text"><i
                                                    class="bx bx-comment"></i></span>
                                            <textarea id="basic-icon-default-message" class="form-control"
                                                placeholder="Digite a descrição do gênero"
                                                aria-label="Digite a descrição do gênero" name="descricao"
                                                aria-describedby="basic-icon-default-message2" required>{GENERO->DESCRICAO}</textarea>
                                        </div>
                                    </div>
                                    <input type="hidden" name="csrf-token" value="{CSRF_TOKEN}" />
                                    <button type="submit" class="btn btn-primary">Salvar</button>
                                </form>
                            </div>
                        </div>
                    </div>
                    <!-- / Content -->

                    <!-- Footer -->
                    {INCLUDE_RODAPE}
                    <!-- / Footer -->

                    <div class="content-backdrop fade"></div>
                </div>
                <!-- Content wrapper -->
            </div>
            <!-- / Layout page -->
        </div>

        {INCLUDE_JAVASCRIPT}

        <!-- Overlay -->
        <div class="layout-overlay layout-menu-toggle"></div>
    </div>
    <!-- / Layout wrapper -->


</body>

</html>
