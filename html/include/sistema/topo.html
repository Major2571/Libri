<aside id="layout-menu" class="layout-menu menu-vertical menu bg-menu-theme">
    <div class="app-brand demo">
        <a href="{URL}" class="app-brand-link">
            <span class="app-brand-logo demo">
                <img src="{URL_IMG}/logo/logo.svg" alt="logo Libri">
            </span>
        </a>

        <a href="javascript:void(0);" class="layout-menu-toggle menu-link text-large ms-auto d-block d-xl-none">
            <i class="bx bx-chevron-left bx-sm align-middle"></i>
        </a>
    </div>

    <div class="menu-inner-shadow"></div>

    <ul class="menu-inner py-1">
        <!-- Dashboard -->
        <li class="menu-item {dashboard_ativo}">
            <a href="{URL}/dashboard" class="menu-link">
                <i class="menu-icon tf-icons bx bx-home-circle"></i>
                <div data-i18n="Analytics">Dashboard</div>
            </a>
        </li>


        <li class="menu-header small text-uppercase">
            <span class="menu-header-text">Institucional</span>
        </li>

        <!-- BEGIN BLOCO_MENU -->
        <li class="menu-item {MENU->ATIVO}">
            <a href="javascript:void(0);" class="menu-link menu-toggle">
                <i class="menu-icon tf-icons bx {MENU->ICONE}"></i>
                <div data-i18n="{MENU->TITULO}">{MENU->TITULO}</div>
            </a>
            <ul class="menu-sub">
                <li class="menu-item {MENU->NOVO_ATIVO}">
                    <a href="{URL}/{MENU->DIRETORIO}/novo" class="menu-link">
                        <div data-i18n="Novo">Novo</div>
                    </a>
                </li>
                <li class="menu-item {MENU->TODOS_ATIVO}">
                    <a href="{URL}/{MENU->DIRETORIO}" class="menu-link">
                        <div data-i18n="Ver Todos">Ver Todos</div>
                    </a>
                </li>
            </ul>
        </li>
        <!-- END BLOCO_MENU -->

        <!-- Sobre -->
        <li class="menu-header small text-uppercase"><span class="menu-header-text">Informações</span></li>
        <li class="menu-item">
            <a href="{URL}/sobre" target="_blank" class="menu-link">
                <i class="menu-icon tf-icons bx bx-file"></i>
                <div data-i18n="Documentation">Sobre</div>
            </a>
        </li>
        
    </ul>
</aside>
