<div class="modal fade" id="modalCadastro" tabindex="-1" aria-labelledby="modalCadastroLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
            <h3 class="modal-title" id="modalCadastroLabel">Criar conta</h3>
            <p class="modal-sub">Comece a organizar o acervo da sua biblioteca hoje.</p>
            <form action="{URL}/cadastro" method="POST">
                <div class="field"><label for="cad-nome">Nome</label><input type="text" id="cad-nome" name="nome"
                        placeholder="Seu nome completo" required></div>
                <div class="field"><label for="cad-email">E-mail</label><input type="email" id="cad-email" name="email"
                        placeholder="voce@biblioteca.com" required></div>
                <div class="field"><label for="cad-senha">Senha</label><input type="password" id="cad-senha"
                        name="senha" placeholder="Mínimo 8 caracteres" required></div>
                <input type="hidden" name="csrf-token" value="{CSRF_TOKEN}">
                <button type="submit" class="btn btn-primary">Criar conta grátis</button>
            </form>
            <div class="modal-switch">Já tem conta? <a data-bs-toggle="modal" data-bs-target="#modalLogin">Entrar</a>
            </div>
        </div>
    </div>
</div>
