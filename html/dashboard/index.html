<!DOCTYPE html>
<html class="no-js" lang="pt-BR">

<head>
    {INCLUDE_CABECALHO}
    <style>
        .card-hover-link .hover-action {
            opacity: 0;
            visibility: hidden;
            transition: all 0.2s ease-in-out;
            text-decoration: none;
        }

        .card-hover-link:hover .hover-action {
            opacity: 1;
            visibility: visible;
        }
    </style>
</head>

<body>

    <div class="layout-wrapper layout-content-navbar">
        <div class="layout-container">

            {INCLUDE_TOPO}

            <div class="layout-page">

                {INCLUDE_NAVBAR}

                <div class="content-wrapper">

                    <div class="container-xxl flex-grow-1 container-p-y">
                        <h4 class="fw-bold py-3 mb-4">Painel</h4>

                        <div class="row g-4">

                            <!-- Livros -->
                            <div class="col-md-4 col-12">
                                <div class="card h-100 card-hover-link">
                                    <div class="card-body pb-4 position-relative">
                                        <div class="d-flex justify-content-between align-items-center mb-3">
                                            <!-- Ícone + Quantidade lado a lado -->
                                            <div class="d-flex align-items-center gap-3">
                                                <span class="avatar avatar-lg">
                                                    <span
                                                        class="avatar-initial rounded-3 bg-label-primary d-flex align-items-center justify-content-center h-100 w-100"
                                                        style="font-size: 22px;">
                                                        <i class="bx bx-book-content fs-4"></i>
                                                    </span>
                                                </span>
                                                <h2 class="mb-0">0</h2>
                                            </div>

                                            <!-- Botão de Novo -->
                                            <a href="{URL}/livros/novo"
                                                class="btn btn-sm btn-icon btn-label-primary rounded-pill"
                                                title="Novo livro">
                                                <i class="bx bx-plus"></i>
                                            </a>
                                        </div>

                                        <div class="d-flex justify-content-between align-items-center align-content-center">
                                            <span class="text-muted d-block">
                                                Livros no acervo
                                            </span>
                                            <a href="{URL}/livros" class="hover-action text-primary small fw-semibold">
                                                Ver todos
                                                <i class="bx bx-right-arrow-alt ms-1"></i>
                                            </a>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Autores -->
                            <div class="col-md-4 col-12">
                                <div class="card h-100 card-hover-link">
                                    <div class="card-body pb-4 position-relative">
                                        <div class="d-flex justify-content-between align-items-center mb-3">
                                            <!-- Ícone + Quantidade lado a lado -->
                                            <div class="d-flex align-items-center gap-3">
                                                <span class="avatar avatar-lg">
                                                    <span
                                                        class="avatar-initial rounded-3 bg-label-info d-flex align-items-center justify-content-center h-100 w-100"
                                                        style="font-size: 22px;">
                                                        <i class="bx bx-user fs-4"></i>
                                                    </span>
                                                </span>
                                                <h2 class="mb-0">{TOTAL_AUTORES}</h2>
                                            </div>

                                            <!-- Botão de Novo -->
                                            <a href="{URL}/autores/novo"
                                                class="btn btn-sm btn-icon btn-label-info rounded-pill"
                                                title="Novo autor">
                                                <i class="bx bx-plus"></i>
                                            </a>
                                        </div>

                                        <div class="d-flex justify-content-between align-items-center align-content-center">
                                            <span class="text-muted d-block">
                                                Autores cadastrados
                                            </span>
                                            <a href="{URL}/autores" class="hover-action text-info small fw-semibold">
                                                Ver todos
                                                <i class="bx bx-right-arrow-alt ms-1"></i>
                                            </a>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Gêneros -->
                            <div class="col-md-4 col-12">
                                <div class="card h-100 card-hover-link">
                                    <div class="card-body pb-4 position-relative">
                                        <div class="d-flex justify-content-between align-items-center mb-3">
                                            <!-- Ícone + Quantidade lado a lado -->
                                            <div class="d-flex align-items-center gap-3">
                                                <span class="avatar avatar-lg">
                                                    <span
                                                        class="avatar-initial rounded-3 bg-label-secondary d-flex align-items-center justify-content-center h-100 w-100"
                                                        style="font-size: 22px;">
                                                        <i class="bx bx-purchase-tag-alt fs-4"></i>
                                                    </span>
                                                </span>
                                                <h2 class="mb-0">{TOTAL_GENEROS}</h2>
                                            </div>

                                            <!-- Botão de Novo -->
                                            <a href="{URL}/generos/novo"
                                                class="btn btn-sm btn-icon btn-label-secondary rounded-pill"
                                                title="Novo gênero">
                                                <i class="bx bx-plus"></i>
                                            </a>
                                        </div>

                                        <div class="d-flex justify-content-between align-items-center align-content-center">
                                            <span class="text-muted d-block">
                                                Gêneros cadastrados
                                            </span>
                                            <a href="{URL}/generos" class="hover-action text-secondary small fw-semibold">
                                                Ver todos 
                                                <i class="bx bx-right-arrow-alt ms-1"></i>
                                            </a>
                                        </div>
                                    </div>
                                </div>
                            </div>

                        </div>
                    </div>
                    <!-- / Content -->

                    {INCLUDE_MANUTENCAO}

                    {INCLUDE_RODAPE}

                </div>
            </div>
        </div>

        {INCLUDE_JAVASCRIPT}


    </div>

</body>

</html>
