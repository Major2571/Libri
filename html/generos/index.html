<!DOCTYPE html>
<html class="no-js" lang="pt-BR">

<head>
    {INCLUDE_CABECALHO}
</head>

<body>
    <!-- Layout wrapper -->
    <div class="layout-wrapper layout-content-navbar">
        <div class="layout-container">

            {INCLUDE_TOPO}

            <div class="layout-page">

                {INCLUDE_NAVBAR}

                <div class="content-wrapper">

                    <div class="container-xxl flex-grow-1 container-p-y">
                        {INCLUDE_ATALHO}

                        <!-- Tabela de gêneros -->
                        <div class="card py-3">

                            <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 p-3">

                                <div class="input-group input-group-merge" style="max-width: 360px;">
                                    <span class="input-group-text" id="basic-addon-search31"><i
                                            class="bx bx-search"></i></span>
                                    <input type="text" id="busca-generos" class="form-control"
                                        placeholder="Buscar por nome…" aria-label="Buscar..."
                                        aria-describedby="basic-addon-search31" />
                                </div>

                                <button type="button" data-bs-toggle="modal" data-bs-target="#modalCenter"
                                    class="btn rounded-pill btn-primary d-inline-flex align-items-center">
                                    <i class="bx bx-plus me-1"></i>
                                    Novo Gênero
                                </button>

                            </div>

                            <div class="table-responsive text-nowrap">
                                <table class="table table-borderless" id="tabela-generos">
                                    <thead>
                                        <tr>
                                            <th>Nome</th>
                                            <th class="text-center">Gênero Principal</th>
                                            <th class="text-end">Ações</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <!-- BEGIN BLOCO_GENEROS -->
                                        <tr>
                                            <td>
                                                <a href="{URL}/generos/editar/{GENERO->ID}"
                                                    class="d-flex align-items-center gap-2 link-primary text-body">
                                                    <strong>{GENERO->NOME}</strong>
                                                </a>
                                            </td>
                                            <td class="text-center">
                                                <span
                                                    class="badge rounded-pill px-3 bg-label-success">{GENERO->GENERO_PAI->NOME}</span>
                                            </td>
                                            <td>
                                                <div class="text-end">
                                                    <a href="{URL}/generos/editar/{GENERO->ID}"
                                                        class="btn btn-icon btn-label-primary rounded-pill"
                                                        title="Editar gênero">
                                                        <i class="bx bx-edit-alt"></i>
                                                    </a>
                                                    <a id="excluir-{GENERO->ID}"
                                                        data-url="{URL}/excluir/Genero/{GENERO->ID}"
                                                        href="{URL}/excluir/Genero/{GENERO->ID}"
                                                        class="btn btn-icon btn-label-danger rounded-pill btn-excluir-genero"
                                                        title="Excluir gênero">
                                                        <i class="bx bx-trash"></i>
                                                    </a>
                                                </div>
                                            </td>
                                        </tr>
                                        <!-- END BLOCO_GENEROS -->
                                        <tr>
                                            <td colspan="3" class="text-center py-5">
                                                <i class="bx bx-category-alt bx-lg text-muted mb-2 d-block"></i>
                                                <span class="fw-semibold d-block">Nenhum gênero cadastrado</span>
                                                <span class="text-muted">Comece criando o primeiro gênero do
                                                    acervo.</span>
                                            </td>
                                        </tr>
                                        <!-- FINALLY BLOCO_GENEROS -->
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>

                    {INCLUDE_RODAPE}

                </div>
            </div>
        </div>

        <div class="modal fade" id="modalCenter" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered" role="document">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="modalCenterTitle">Adicione um novo gênero</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <form id="inserir" action="{URL}/Genero/salvar" method="POST">

                            <div class="mb-3">
                                <label class="form-label" for="genero_pai">Genero Principal</label>
                                <div class="input-group input-group-merge">
                                    <select class="form-select required" id="genero_pai" name="genero_pai"
                                        aria-label="Escolha o gênero principal" placeholder="Escolha o gênero principal">
                                        <option value="" disabled selected>Escolha o gênero principal</option>
                                        <!-- BEGIN BLOCO_GENEROS_MODAL -->
                                        <option value="{GENERO->ID}">{GENERO->NOME}</option>
                                        <!-- END BLOCO_GENEROS_MODAL -->
                                        <option value="" disabled selected>Nenhum gênero encontrado</option>
                                        <!-- FINALLY BLOCO_GENEROS_MODAL -->
                                    </select>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label required" for="nome">Nome *</label>
                                <div class="input-group input-group-merge">
                                    <span id="nome2" class="input-group-text">
                                        <i class="bx bx-text"></i>
                                    </span>
                                    <input type="text" id="nome" class="form-control"
                                        placeholder="Digite o nome do gênero" name="nome"
                                        aria-label="Digite o nome do gênero" aria-describedby="nome2" required />
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label" for="basic-icon-default-message">Descrição *</label>
                                <div class="input-group input-group-merge">
                                    <span id="basic-icon-default-message2" class="input-group-text"><i
                                            class="bx bx-comment"></i></span>
                                    <textarea id="basic-icon-default-message" class="form-control"
                                        placeholder="Digite a descrição do gênero" name="descricao"
                                        aria-label="Digite a descrição do gênero"
                                        aria-describedby="basic-icon-default-message2" required></textarea>
                                </div>
                            </div>

                            <input type="hidden" name="csrf-token" value="{CSRF_TOKEN}" />

                            <div class="d-flex justify-content-center">
                                <button type="submit" class="btn btn-primary">Salvar</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        {INCLUDE_JAVASCRIPT}

        <script>
            document.getElementById('busca-generos')?.addEventListener('input', function (e) {
                const termo = e.target.value.toLowerCase();
                document.querySelectorAll('#tabela-generos tbody tr').forEach(function (tr) {
                    tr.style.display = tr.textContent.toLowerCase().includes(termo) ? '' : 'none';
                });
            });
        </script>

    </div>

</body>

</html>
